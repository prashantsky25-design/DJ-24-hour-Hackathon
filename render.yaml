services:
  - type: web
    name: ares-backend
    env: python
    rootDir: backend/orchestrator
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: CORS_ORIGINS
        value: "*"
      # Set your GROQ_API_KEY, GEMINI_API_KEY, or OPENAI_API_KEY in the Render Dashboard

  - type: web
    name: ares-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ares-backend
          envVarKey: RENDER_EXTERNAL_URL
      # Set VITE_GEMINI_API_KEY in the Render Dashboard
